<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Creator Studio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" id="dynamic-favicon" href="https://lirp.cdn-website.com/e4e4cefa/dms3rep/multi/opt/Magum_logo+magenta-1920w.png">
</head>
<body>

  <div class="glow-bg glow-purple"></div>
  <div class="glow-bg glow-magenta"></div>

  <main class="login-container">
    <div class="login-card">
      
      <header class="card-header">
        <img 
          src="https://lirp.cdn-website.com/e4e4cefa/dms3rep/multi/opt/Magum_logo+magenta-1920w.png" 
          alt="Logo" 
          class="brand-logo"
        >
        <span class="badge-studio">CREATOR STUDIO</span>
        <h1 class="login-title">Portal de Clientes</h1>
        <p class="login-subtitle">Ingresa tus credenciales para administrar tu negocio</p>
      </header>

      <div id="alert-box" class="alert-box" style="display: none;"></div>

      <form id="login-form" class="login-form" action="javascript:void(0);" method="POST" onsubmit="return false;">
        
        <div class="form-group">
          <label for="email" class="form-label">Usuario o Correo electrónico</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user input-icon"></i>
            <input 
              type="text" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="Usuario o correo" 
              required
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Contraseña" 
              required
              autocomplete="current-password"
            >
            <button type="button" id="toggle-password" class="btn-toggle-password" title="Mostrar u ocultar contraseña">
              <i class="fa-regular fa-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="remember-me">
            <span class="checkmark"></span>
            Recordar mi sesión
          </label>
          <a href="#" id="forgot-password-link" class="link-support">¿Problemas de acceso?</a>
        </div>

        <button type="submit" id="btn-submit" class="btn-submit">
          <span class="btn-text">Ingresar a mi panel</span>
          <i class="fa-solid fa-arrow-right btn-icon"></i>
        </button>

      </form>

      <footer class="card-footer">
        <p class="footer-note">
          <i class="fa-solid fa-shield-halved"></i> Acceso exclusivo para clientes de la plataforma.
        </p>
      </footer>

    </div>
  </main>

  <!-- Modal Selector de Empresas (Multi-Cuenta) -->
  <div id="modal-select-account" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(6px); z-index: 9999; align-items: center; justify-content: center; padding: 20px;">
    <div class="modal-box" style="background: #ffffff; width: 100%; max-width: 440px; border-radius: 16px; padding: 28px; box-shadow: 0 20px 45px rgba(0,0,0,0.3); text-align: center; border: 1px solid rgba(0,0,0,0.08);">
      <div style="width: 54px; height: 54px; border-radius: 14px; background: rgba(33,0,135,0.08); color: #210087; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 1.5rem;">
        <i class="fa-solid fa-building"></i>
      </div>
      <h3 style="margin: 0 0 8px; font-size: 1.3rem; font-weight: 700; color: #1e293b;">Selecciona tu Empresa</h3>
      <p style="margin: 0 0 20px; font-size: 0.88rem; color: #64748b;">Tu correo tiene acceso a varias empresas. Elige a cuál deseas ingresar:</p>
      <div id="account-selector-list" style="display: flex; flex-direction: column; gap: 10px; max-height: 280px; overflow-y: auto; margin-bottom: 18px;">
        <!-- Opciones inyectadas dinámicamente -->
      </div>
      <button type="button" id="btn-cancel-account-select" style="background: transparent; border: 1px solid #cbd5e1; color: #64748b; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.2s;">
        Cancelar
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/notify.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
